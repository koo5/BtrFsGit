[tool]
[tool.poetry]
name = "btrfsgit"
version = "9000.0.2"
homepage = "https://github.com/koo5/btrfsgit"
description = "git-like workflow for BTRFS subvolumes. Commit, push, checkout, stash, pull..."
authors = ["koo5 <kolman.jindrich@gmail.com>"]
readme = "README.md"
license =  "GNU Affero General Public License v3 or later (AGPLv3+)"
classifiers=[
    'Development Status :: 3 - Alpha',
    'Intended Audience :: Developers',
    'License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)',
    'Natural Language :: English',
    'Programming Language :: Python :: 3',
    'Programming Language :: Python :: 3.9',
    'Programming Language :: Python :: 3.10',
    'Programming Language :: Python :: 3.11',
    'Programming Language :: Python :: 3.12',
]
packages = [
    { include = "btrfsgit" },
    { include = "tests", format = "sdist" },
]
include = [
    { path = "btrfsgit/volwalker2.pl", format = ["sdist", "wheel"] },
]

[tool.poetry.dependencies]
python = ">=3.9,<4.0"
fire = "^0.7.0"
pathvalidate = "^2.5.0"
sqlalchemy = "^2.0.36"
psycopg2 = "^2.9.10"

[tool.poetry.group.test.dependencies]
pytest = "^8.0"
pytest-cov = "^5.0"

[tool.poetry.group.dev.dependencies]
black = "^24.0"
isort = "^5.13"
flake8 = "^7.0"
tox = "^4.0"
pre-commit = "^3.5"
twine = "^5.0"
toml = "^0.10.2"

[tool.poetry.scripts]
bfg = 'btrfsgit.btrfsgit:main'

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
markers = [
    "integration: needs a real btrfs filesystem (loopback) and sudo; deselect with -m 'not integration'",
]

[tool.black]
line-length = 88
include = '\.pyi?$'
exclude = '''
/(
    \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''
